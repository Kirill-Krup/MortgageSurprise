global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'mortgage-surprise'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['app:8080']
        labels:
          application: 'mortgage-surprise'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']